services:
  otel-collector:
    # Stock contrib distribution: groupbytrace (emit_strategy: service, >= 0.163.0)
    # plus transform (shared_cache) implement the subtrace aggregation.
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - DT_OTLP_ENDPOINT=${DT_OTLP_ENDPOINT:?set DT_OTLP_ENDPOINT, e.g. https://<env>.live.dynatrace.com/api/v2/otlp}
      - DT_INGEST_TOKEN=${DT_INGEST_TOKEN:?set DT_INGEST_TOKEN}
    ports:
      - "14317:4317"
      - "14318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "26686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  service-a:
    build:
      context: .
      dockerfile: Dockerfile.service-a
    ports:
      - "18001:8001"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - SERVICE_B_URL=http://service-b:8002
    depends_on:
      - otel-collector
      - service-b

  service-b:
    build:
      context: .
      dockerfile: Dockerfile.service-b
    ports:
      - "18002:8002"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - otel-collector
