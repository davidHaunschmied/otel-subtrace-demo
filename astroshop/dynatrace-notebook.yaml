# Dynatrace notebook for the astroshop subtrace showcase.
#   dtctl create notebook -f astroshop/dynatrace-notebook.yaml
name: Astroshop subtrace showcase
content:
  defaultTimeframe:
    from: now()-2h
    to: now()
  defaultSegments: []
  sections:
    - id: fc296d5f-06d2-424a-9871-453c194f708e
      type: markdown
      markdown: |-
        # Astroshop subtrace showcase

        The Collector releases every **call to a service** as one batch (`groupbytrace`, `emit_strategy: service`) and aggregates over it with the `transform` processor (`shared_cache`). The result lands on the span that entered the call (`subtrace.is_root_span == true`).

        All demo data carries `deployment.release_product == "astroshop-subtrace-demo"`.

    - id: 9ad2766f-4887-442c-b656-c7381915e2e0
      type: markdown
      markdown: |-
        ## 🔍 N+1 detection: one product lookup per cart item

        `subtrace.outbound_calls` counts the outgoing calls of each call, per operation. Checkout calls `GetProduct` and `Convert` once per cart item.

    - id: b79e2559-4f4e-4ed2-b338-bc9543593ac0
      type: dql
      showTitle: true
      title: Checkout — outgoing calls per order, by number of product lookups
      height: 260
      state:
        visualization: table
        input:
          value: |-
            fetch spans
            | filter deployment.release_product == "astroshop-subtrace-demo" and subtrace.is_root_span == true
            | filter service.name == "checkout" and span.name == "oteldemo.CheckoutService/PlaceOrder"
            | fieldsAdd product_lookups = toLong(subtrace.outbound_calls[`oteldemo.ProductCatalogService/GetProduct`]),
                        currency_conversions = toLong(subtrace.outbound_calls[`oteldemo.CurrencyService/Convert`])
            | summarize { orders = count(), avg_currency_conversions = avg(currency_conversions), avg_duration = avg(duration) }, by:{product_lookups}
            | sort product_lookups asc

    - id: 715c4d73-c8d0-4edd-87bd-084c56a4f90b
      type: dql
      showTitle: true
      title: Database calls per call, by operation
      height: 300
      state:
        visualization: table
        input:
          value: |-
            fetch spans
            | filter deployment.release_product == "astroshop-subtrace-demo" and subtrace.is_root_span == true
            | summarize { calls = count(), avg_db_calls = avg(subtrace.db_call_count), max_db_calls = max(subtrace.db_call_count) }, by:{service.name, span.name}
            | filter max_db_calls > 0
            | sort avg_db_calls desc

    - id: ce9c6b04-6058-4c50-985d-c344f8c30009
      type: markdown
      markdown: |-
        ## ⚠️ Error propagation: the inner error message on the entry span

        `subtrace.error_message` is the status message of the first failing span inside the call (the `paymentFailure` flag fails 25% of charges). On checkout the entry span's own status is the wrapped `failed to charge card: …`; the attribute carries the original cause as a field of its own, ready to group by.

    - id: cf2c51ae-b510-47f1-8325-a0e4d3a07c9d
      type: dql
      showTitle: true
      title: Failed calls by propagated error message
      height: 260
      state:
        visualization: table
        input:
          value: |-
            fetch spans
            | filter deployment.release_product == "astroshop-subtrace-demo" and subtrace.is_root_span == true
            | filter service.name != "load-generator"
            | filter subtrace.error_count > 0 and isNotNull(subtrace.error_message)
            | summarize failed_calls = count(), by:{service.name, span.name, entry_span_status = span.status_message, subtrace.error_message}
            | sort failed_calls desc

    - id: dc17beb5-0b62-4d7e-93ee-bf8b4446f22b
      type: markdown
      markdown: |-
        ## 📊 Business context: loyalty level on the payment entry span

        `subtrace.user.loyalty_level` is copied from payment's inner `charge` span, so the entry span can be sliced by it directly.

    - id: d0cfb66c-2f5f-4467-8dee-c336985e9a84
      type: dql
      showTitle: true
      title: Payments and failure rate by loyalty level
      height: 240
      state:
        visualization: table
        input:
          value: |-
            fetch spans
            | filter deployment.release_product == "astroshop-subtrace-demo" and subtrace.is_root_span == true
            | filter isNotNull(subtrace.user.loyalty_level)
            | summarize { payments = count(), failed = countIf(subtrace.error_count > 0) }, by:{subtrace.user.loyalty_level}
            | fieldsAdd failure_rate_pct = round(100.0 * failed / payments, decimals:1)
            | sort failure_rate_pct desc

    - id: e574845d-598a-4b38-ba63-f916bacd781a
      type: markdown
      markdown: |-
        # 📈 Metrics by endpoint

        OpenPipeline extracts metrics from the entry spans (`openpipeline-span-metrics.json`, span pipeline "All spans"), all with `service.name` and `endpoint.name` as dimensions:

        | Metric | Type | Source |
        |---|---|---|
        | `astroshop.subtrace.calls` | counter | every entry span, plus `subtrace.user.loyalty_level` |
        | `astroshop.subtrace.failed_calls` | counter | `subtrace.error_count > 0`, plus `subtrace.error_message`, `subtrace.user.loyalty_level` |
        | `astroshop.subtrace.db_calls` | value | `subtrace.db_call_count` |
        | `astroshop.subtrace.errors` | value | `subtrace.error_count` |
        | `astroshop.subtrace.duration` | histogram (µs) | span duration |

        ## ⚠️ Failure detection on inner failures

        The failure detection ruleset *Astroshop subtrace demo: fail on inner span errors* keeps the default rules and adds the custom rule `subtrace.error_count > 0`. A call now fails when anything inside it failed, even if its own status hides it: `POST /api/checkout` answers HTTP 422, which the default rules count as success. The built-in `dt.service.request.failure_count` reflects this per endpoint from the moment the rule was added.

    - id: e72bed9f-b0c4-49b2-803b-41a3d2c82845
      type: dql
      showTitle: true
      title: Failure rate by endpoint (built-in service metrics, with the inner-failure rule)
      height: 260
      state:
        visualization: table
        input:
          value: |-
            timeseries { requests = sum(dt.service.request.count), failed = sum(dt.service.request.failure_count) },
              by:{ dt.service.name, endpoint.name },
              filter: deployment.release_product == "astroshop-subtrace-demo" and not in(dt.service.name, { "flagd", "load-generator" }),
              union: true
            | fieldsAdd requests = arraySum(requests), failed = coalesce(arraySum(failed), 0)
            | filter failed > 0
            | fieldsAdd failure_rate_pct = round(100.0 * failed / requests, decimals:1)
            | fields dt.service.name, endpoint.name, requests, failed, failure_rate_pct
            | sort failure_rate_pct desc

    - id: 5da1cf82-3a8a-4fc7-a8fb-cc5ec4723a45
      type: dql
      showTitle: true
      title: Checkout path — failure rate over time by endpoint
      height: 280
      state:
        visualization: lineChart
        input:
          value: |-
            timeseries { requests = sum(dt.service.request.count), failed = sum(dt.service.request.failure_count) },
              by:{ endpoint.name },
              filter: deployment.release_product == "astroshop-subtrace-demo"
                and in(endpoint.name, { "POST /api/checkout", "oteldemo.CheckoutService/PlaceOrder", "oteldemo.PaymentService.Charge" }),
              interval: 10m, union: true
            | fieldsAdd failure_rate_pct = 100.0 * coalesce(failed[], 0) / requests[]
            | fields timeframe, interval, endpoint.name, failure_rate_pct

    - id: ad58bb8b-c238-4a01-834e-30014c081066
      type: dql
      showTitle: true
      title: Failed calls by endpoint and propagated error message
      height: 240
      state:
        visualization: table
        input:
          value: |-
            timeseries failed = sum(astroshop.subtrace.failed_calls),
              by:{ service.name, endpoint.name, subtrace.error_message },
              filter: deployment.release_product == "astroshop-subtrace-demo" and not in(service.name, { "flagd", "load-generator" })
            | fieldsAdd failed = arraySum(failed)
            | fields service.name, endpoint.name, subtrace.error_message, failed
            | sort failed desc

    - id: f2c570c3-024d-472b-8fe5-a75692d3b724
      type: markdown
      markdown: |-
        ## 🔍 Database calls per endpoint

        `astroshop.subtrace.db_calls` sums `subtrace.db_call_count` over the entry spans; divided by `astroshop.subtrace.calls` it gives database calls per call. A rising value on an endpoint is the N+1 signal.

    - id: 97d46f98-9fba-4776-a347-a1fe1b8c760f
      type: dql
      showTitle: true
      title: Database calls per call, by endpoint
      height: 220
      state:
        visualization: table
        input:
          value: |-
            timeseries { db_calls = sum(astroshop.subtrace.db_calls), calls = sum(astroshop.subtrace.calls), max_db_calls = max(astroshop.subtrace.db_calls) },
              by:{ service.name, endpoint.name },
              filter: deployment.release_product == "astroshop-subtrace-demo"
            | fieldsAdd db_calls = arraySum(db_calls), calls = arraySum(calls), max_db_calls = arrayMax(max_db_calls)
            | filter max_db_calls > 0
            | fieldsAdd db_calls_per_call = round(db_calls / calls, decimals:2)
            | fields service.name, endpoint.name, calls, db_calls, db_calls_per_call, max_db_calls
            | sort db_calls_per_call desc

    - id: 353e9f3d-8077-4100-b19e-3b3b1f72ad35
      type: dql
      showTitle: true
      title: Database calls per call over time, by endpoint
      height: 260
      state:
        visualization: lineChart
        input:
          value: |-
            timeseries { db_calls = sum(astroshop.subtrace.db_calls), calls = sum(astroshop.subtrace.calls) },
              by:{ endpoint.name },
              filter: deployment.release_product == "astroshop-subtrace-demo",
              interval: 5m
            | filter arraySum(db_calls) > 0
            | fieldsAdd db_calls_per_call = db_calls[] / calls[]
            | fields timeframe, interval, endpoint.name, db_calls_per_call

    - id: 645533ff-1a03-48a4-a28a-ac029fdaacd3
      type: markdown
      markdown: |-
        ## 📊 Customer loyalty by endpoint

        `subtrace.user.loyalty_level` is a dimension of the call counters, so failure rates can be split by customer segment per endpoint without touching spans.

    - id: f2dc94ac-fe30-4eff-81ca-deeefe9f5ce4
      type: dql
      showTitle: true
      title: Calls and failure rate by endpoint and loyalty level
      height: 240
      state:
        visualization: table
        input:
          value: |-
            timeseries { calls = sum(astroshop.subtrace.calls), failed = sum(astroshop.subtrace.failed_calls) },
              by:{ endpoint.name, subtrace.user.loyalty_level },
              filter: deployment.release_product == "astroshop-subtrace-demo" and isNotNull(subtrace.user.loyalty_level),
              union: true
            | fieldsAdd calls = arraySum(calls), failed = coalesce(arraySum(failed), 0)
            | fieldsAdd failure_rate_pct = round(100.0 * failed / calls, decimals:1)
            | fields endpoint.name, subtrace.user.loyalty_level, calls, failed, failure_rate_pct
            | sort endpoint.name asc, failure_rate_pct desc

    - id: f062e2b3-557c-47bb-894f-a6b7840fd66f
      type: dql
      showTitle: true
      title: Payment — failure rate over time by loyalty level
      height: 260
      state:
        visualization: lineChart
        input:
          value: |-
            timeseries { calls = sum(astroshop.subtrace.calls), failed = sum(astroshop.subtrace.failed_calls) },
              by:{ subtrace.user.loyalty_level },
              filter: deployment.release_product == "astroshop-subtrace-demo"
                and endpoint.name == "oteldemo.PaymentService.Charge" and isNotNull(subtrace.user.loyalty_level),
              interval: 10m, union: true
            | fieldsAdd failure_rate_pct = 100.0 * coalesce(failed[], 0) / calls[]
            | fields timeframe, interval, subtrace.user.loyalty_level, failure_rate_pct

    - id: 53c8dc47-4359-4ca0-9fca-5ccf39baa2c1
      type: dql
      showTitle: true
      title: Ingest check — all signals by release product
      height: 200
      state:
        visualization: table
        input:
          value: |-
            fetch spans
            | filter deployment.release_product == "astroshop-subtrace-demo"
            | summarize { spans = count(), entry_spans = countIf(subtrace.is_root_span == true), services = countDistinct(service.name) }
