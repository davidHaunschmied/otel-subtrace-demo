receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Releases one batch per call to a service ("subtrace") instead of per trace.
  groupbytrace:
    wait_duration: 5s
    num_traces: 100000
    emit_strategy: service

  # Aggregates over each batch and writes the result to the span that entered
  # the call. shared_cache keeps state across the two statement groups for the
  # duration of one batch, i.e. one subtrace.
  transform/summarize_subtrace:
    error_mode: ignore
    trace_statements:
      # Pass 1: collect over every span of the subtrace.
      - context: span
        shared_cache: true
        statements:
          - set(cache["span_ids"][span.span_id.string], true)
          # N+1 detection: database calls and the distinct tables they touched
          - set(cache["db_calls"], 0) where cache["db_calls"] == nil
          - set(cache["db_calls"], cache["db_calls"] + 1) where span.attributes["db.system"] != nil
          - append(cache["tables"], span.attributes["db.sql.table"]) where span.attributes["db.sql.table"] != nil and (cache["tables"] == nil or not ContainsValue(cache["tables"], span.attributes["db.sql.table"]))
          # Error propagation: count failing spans, keep the first inner message
          - set(cache["error_count"], 0) where cache["error_count"] == nil
          - set(cache["error_count"], cache["error_count"] + 1) where span.status.code == STATUS_CODE_ERROR
          - set(cache["error_message"], span.status.message) where cache["error_message"] == nil and span.status.code == STATUS_CODE_ERROR and span.status.message != "" and span.kind != SPAN_KIND_SERVER and span.kind != SPAN_KIND_CONSUMER
          # Business context: first loyalty status seen anywhere in the subtrace
          - set(cache["loyalty"], span.attributes["customer.loyalty_status"]) where cache["loyalty"] == nil and span.attributes["customer.loyalty_status"] != nil

      # Pass 2: the root span of the subtrace is the one whose parent is not in the batch.
      - context: span
        shared_cache: true
        conditions:
          - cache["span_ids"][span.parent_span_id.string] == nil
        statements:
          - set(span.attributes["subtrace.is_root_span"], true)
          - set(cache["root"], span.span_id.string)
          - set(span.attributes["subtrace.db_call_count"], cache["db_calls"])
          - set(span.attributes["subtrace.tables_accessed"], cache["tables"]) where cache["tables"] != nil
          - set(span.attributes["subtrace.error_count"], cache["error_count"])
          - set(span.attributes["subtrace.error_message"], cache["error_message"]) where cache["error_message"] != nil
          - set(span.attributes["subtrace.customer.loyalty_status"], cache["loyalty"]) where cache["loyalty"] != nil

      # Pass 3: tag every span with its subtrace (the root span's ID).
      - context: span
        shared_cache: true
        statements:
          - set(span.attributes["subtrace.id"], cache["root"]) where cache["root"] != nil

  batch:
    timeout: 1s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  otlphttp/dynatrace:
    endpoint: ${env:DT_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:DT_INGEST_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      # transform/summarize_subtrace must directly follow groupbytrace:
      # anything in between that merges or splits batches breaks the subtrace scope.
      processors: [groupbytrace, transform/summarize_subtrace, batch]
      exporters: [otlp/jaeger, otlphttp/dynatrace]
